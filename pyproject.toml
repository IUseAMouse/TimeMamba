[project]
name = "timessm"
version = "0.1.0"
description = "TimeSSM: a linear time-invariant state space forecaster with a rate knob, built on the TimeJEPA training and evaluation stack"
authors = [
    {name = "Yvann VINCENT", email = "yvann.vincent@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Aligned on ../TimeJEPA/pyproject.toml (same torch / lightning / numpy
# constraints): TimeJEPA is imported as a library, never copied, so the two
# environments must resolve to the same stack. The CUDA build caveat of the
# TimeJEPA file applies here too (pin the wheel index on a rented GPU).
dependencies = [
    "timejepa",
    "torch>=2.8.0",
    "pytorch-lightning>=2.5.0",
    "numpy>=2.3.0",
    "einops>=0.7.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "wandb>=0.22.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
# The March 2025 Mamba code (src/models/, tests/test.py, train.py) runs on the
# `lightning` package and mlflow, a stack TimeJEPA does not use. Kept behind an
# extra so the old tests stay runnable: uv sync --extra legacy
legacy = [
    "lightning>=2.5.1",
    "mlflow>=2.19.0",
    "pandas>=2.2.0",
    "matplotlib>=3.5.0",
]
dev = [
    "black",
    "isort",
    "flake8",
]

[tool.uv.sources]
timejepa = { path = "../TimeJEPA", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timessm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
