# @package _global_
# WIDE-RANGE Delta arm (2026-09-12): resume the spike's best checkpoint (weights
# only, fresh optimizer and short cosine) and expose the knob to the whole
# range the eval asks for. Verdict of P-SSM.2 on 1.3022: the knob wins at
# k <= 8 and loses at k >= 16 because delta_scales [0.25..4] never trained it
# there. One variable: the delta_scales list (mirrors K_CANDIDATES, 1/48 to
# 4) and its probability; everything else is the spike's recipe.
#
#   python scripts/train_ssm.py --config-name ssm_mini_v3_wide \
#       '+training.pretrained_encoder_path="checkpoints/timessm_mini_v3_zs/pretrain_False/<best>.ckpt"' \
#       wandb.run_name=ssm-mini-v3-wide
#   # then: STACK="+ratein=delta +ratein_pool=true" scripts/eval_checkpoints_ssm.sh \
#   #       checkpoints/timessm_mini_v3_wide_zs/pretrain_False
#
# Budget: schedule_fraction 0.03 of the epoch = 10% of the spike's run
# (~12 h at 5.2 it/s), validation and checkpoint every 20% of it. LR 1e-4
# (a third of the spike's peak: the weights are trained, the knob is what
# moves), warmup 10% of the short run.
#
# P-SSM.2c (graved before the run): on the wide checkpoint, +ratein=delta
# (no max_k) >= +ratein=backtest by 0.3 pt of CRPS, and the per-config table
# no longer shows the k >= 16 losses (bizitobs_service, bizitobs_l2c).
# FAILURE if delta <= backtest: the knob does not transfer at large k even
# when trained there, the hybrid (delta_max_k) stays the official layer.
defaults:
  - ssm_mini_v3
  - _self_

model:
  name: "timessm_mini_v3_wide_zs"

training:
  pretrained_encoder_path: null      # pass on the command line, never bake a path
  delta_scales: [0.020833, 0.03125, 0.041667, 0.0625, 0.083333, 0.125, 0.166667, 0.25, 0.333333, 0.5, 1.0, 2.0, 4.0]
  p_delta_scale: 0.7
  schedule_fraction: 0.03
  optimizer:
    learning_rate: 1.0e-4
  lr_scheduler:
    warmup_epochs: 0.003

trainer:
  val_check_interval: 0.2

wandb:
  tags: ["timessm", "ssm", "lti", "delta-knob", "wide-range", "resume", "lotsa", "v3", "mini"]
